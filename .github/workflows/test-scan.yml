name: Test Scan Step

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt || true

      - name: اجرای run_once گام به گام
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          GROQ_KEY: ${{ secrets.GROQ_KEY }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          USE_PROXY: '0'
          LOCAL_RUN: '0'
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: '1'
        run: |
          timeout 300 python - << 'PYEOF'
          import sys, time
          sys.path.insert(0, ".")
          print("۱. import ماژول", flush=True)
          import importlib.util
          spec = importlib.util.spec_from_file_location("mf", "monitor_full.py")
          m = importlib.util.module_from_spec(spec)
          sys.modules["mf"] = m
          spec.loader.exec_module(m)
          print("۲. setup_bot_profile", flush=True)
          m.setup_bot_profile()
          print("۳. شروع run_once", flush=True)
          t0 = time.time()
          n = m.run_once(5, 1)
          print(f"۴. run_once تمام شد: {n} پروژه در {time.time()-t0:.1f}s", flush=True)
          PYEOF
