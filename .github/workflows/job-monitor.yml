name: Job Monitor Bot

# اجرای خودکار هر ساعت + امکان اجرای دستی
on:
  schedule:
    # هر ساعت (زمان UTC)
    - cron: '0 * * * *'
  workflow_dispatch:
    # پارامترهای اجرای دستی
    inputs:
      max_proposals:
        description: 'حداکثر تعداد پیشنهاد در هر اجرا'
        required: false
        default: '3'

# برای جلوگیری از اجرای همزمان
concurrency:
  group: job-monitor
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: 📥 دریافت کد
        uses: actions/checkout@v4

      - name: 🐍 نصب Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: ⚙️ نصب وابستگی‌ها
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt || true

      - name: 🔍 اجرای اسکن پروژه‌ها
        # کلیدها مستقیم از secrets به env — نه از طریق فایل .env
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          GROQ_KEY: ${{ secrets.GROQ_KEY }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_MODEL: gemini-3.8-flash
          MAX_PROPOSALS_PER_RUN: '3'
          USE_PROXY: '0'
          LOCAL_RUN: '0'
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: '1'
        run: |
          echo "🚀 شروع اسکن..."
          python monitor_full.py \
            --min-score 5 \
            --max-proposals ${{ github.event.inputs.max_proposals || '3' }} \
            --no-keepalive
