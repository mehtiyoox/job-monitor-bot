name: Job Monitor Bot

# اجرای خودکار هر ساعت + امکان اجرای دستی
on:
  schedule:
    # هر ساعت (زمان UTC)
    - cron: '0 * * * *'
  workflow_dispatch:
    # پارامترهای اجرای دستی
    inputs:
      max_proposals:
        description: 'حداکثر تعداد پیشنهاد در هر اجرا'
        required: false
        default: '3'

# برای جلوگیری از اجرای همزمان
concurrency:
  group: job-monitor
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 دریافت کد
        uses: actions/checkout@v4

      - name: 🐍 نصب Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: ⚙️ نصب وابستگی‌ها
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt || true

      - name: 🔐 تنظیم کلیدها از GitHub Secrets
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          GROQ_KEY: ${{ secrets.GROQ_KEY }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          # ساخت فایل .env از secrets
          cat > .env << 'EOF'
          TG_BOT_TOKEN=${TG_BOT_TOKEN}
          TG_CHAT_ID=${TG_CHAT_ID}
          GROQ_KEY=${GROQ_KEY}
          GEMINI_KEY=${GEMINI_KEY}
          DATABASE_URL=${DATABASE_URL}
          GEMINI_MODEL=gemini-3.8-flash
          MAX_PROPOSALS_PER_RUN=3
          EOF
          echo "✅ فایل .env ساخته شد"
          # بررسی
          python -c "import ast; ast.parse(open('monitor_full.py', encoding='utf-8').read()); print('syntax OK')"

      - name: 🔄 بازیابی دیتابیس کش شده
        uses: actions/cache@v4
        with:
          path: jobs.db
          key: jobs-db-v1
          restore-keys: |
            jobs-db-v1

      - name: 🔍 اجرای اسکن پروژه‌ها
        env:
          USE_PROXY: '0'
          LOCAL_RUN: '0'
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: '1'
        run: |
          echo "🚀 شروع اسکن..."
          python monitor_full.py \
            --min-score 5 \
            --max-proposals ${{ github.event.inputs.max_proposals || '3' }} \
            --no-keepalive

      - name: 💾 ذخیره‌ی دیتابیس
        uses: actions/cache@v4
        with:
          path: jobs.db
          key: jobs-db-v1
