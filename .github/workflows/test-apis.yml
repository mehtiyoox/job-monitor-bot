name: Test APIs

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt || true

      - name: تست همه APIها
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          GROQ_KEY: ${{ secrets.GROQ_KEY }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          USE_PROXY: '0'
          LOCAL_RUN: '0'
        run: |
          python - << 'PYEOF'
          import sys, os, json, urllib.request
          sys.path.insert(0, ".")
          import importlib.util
          spec = importlib.util.spec_from_file_location("mf", "monitor_full.py")
          m = importlib.util.module_from_spec(spec)
          sys.modules["mf"] = m
          spec.loader.exec_module(m)
          print("TG_BOT_TOKEN طول:", len(m.TG_BOT_TOKEN))
          print("DATABASE_URL طول:", len(m.DATABASE_URL))
          print("GROQ_KEY طول:", len(m.GROQ_KEY))
          print("GEMINI_KEY طول:", len(m.GEMINI_KEY))

          print("\n۲. تلگرام...")
          try:
              req = urllib.request.Request(f"https://api.telegram.org/bot{m.TG_BOT_TOKEN}/getMe")
              with urllib.request.urlopen(req, timeout=15) as r:
                  d = json.loads(r.read().decode())
                  print("✅ تلگرام:", d["result"]["username"], flush=True)
          except Exception as e:
              print("❌ تلگرام:", e, flush=True)

          print("\n۳. Postgres...", flush=True)
          try:
              conn = m.init_db()
              n = conn.execute("SELECT COUNT(*) FROM jobs").fetchone()[0]
              print(f"✅ Postgres: {n} پروژه", flush=True)
              conn.close()
          except Exception as e:
              print("❌ Postgres:", e, flush=True)

          print("\n۴. Groq...", flush=True)
          try:
              ok, r = m._call_groq("llama-3.3-70b-versatile", "سلام")
              print("✅ Groq OK" if ok else f"❌ Groq: {r}", flush=True)
          except Exception as e:
              print("❌ Groq:", e, flush=True)

          print("\n۵. Gemini...", flush=True)
          try:
              ok, r = m._call_gemini("gemini-3.8-flash", "سلام")
              print("✅ Gemini OK" if ok else f"❌ Gemini: {r}", flush=True)
          except Exception as e:
              print("❌ Gemini:", e, flush=True)
          PYEOF
